<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bingo — Bombo (1–90)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="top">
      <div>
        <h1>Bombo Bingo</h1>
        <p class="sub">1–90 · dark/light · voz opcional · timestamp de partida al reiniciar</p>
      </div>

      <div class="right">
        <button id="themeBtn" class="icon" aria-label="Cambiar tema">🌙</button>

        <div class="badge" title="Números restantes">
          <span id="remaining">90</span>
          <small>restantes</small>
        </div>
      </div>
    </header>

    <section class="panel">
      <div class="meta">
        <div class="meta-item">
          <span class="label">Partida (timestamp)</span>
          <span class="value mono" id="startedAtLabel">—</span>
        </div>
      </div>

      <div class="big-number" id="current">—</div>

      <div class="controls">
        <button id="drawBtn" class="primary">Sacar número</button>
        <button id="undoBtn">Deshacer</button>
        <button id="resetBtn" class="danger">Reiniciar</button>
      </div>

      <div class="row">
        <label class="check">
          <input type="checkbox" id="syncToggle" checked />
          <span>Guardar historial (localStorage)</span>
        </label>

        <div class="autoplay">
          <button id="autoBtn">Auto</button>
          <label>
            Intervalo (s)
            <input id="intervalInput" type="number" min="1" max="10" value="2" />
          </label>
        </div>
      </div>

      <hr class="sep" />

      <div class="row">
        <label class="check">
          <input type="checkbox" id="voiceToggle" checked />
          <span>Voz (cantar número)</span>
        </label>

        <div class="voice-controls">
          <label>
            Idioma
            <select id="voiceLang">
              <option value="es-ES" selected>es-ES</option>
              <option value="ca-ES">ca-ES</option>
              <option value="en-GB">en-GB</option>
            </select>
          </label>

          <label>
            Velocidad
            <input id="voiceRate" type="range" min="0.8" max="1.3" step="0.05" value="1" />
          </label>
        </div>
      </div>

      <p class="hint small" id="voiceHint">
        Nota: algunos móviles requieren interacción (click) antes de permitir la voz.
      </p>
    </section>

    <section class="panel">
      <h2>Historial</h2>
      <div id="history" class="history"></div>
      <p class="hint">Espacio = sacar · Z = deshacer · R = reiniciar</p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
