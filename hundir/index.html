<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Hundir la flota · Emparejar (LAN)</title>

  <style>
    :root{
      --bg: #0b1020;
      --fg: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.70);
      --card: rgba(255,255,255,.07);
      --line: rgba(255,255,255,.12);
      --shadow: 0 16px 50px rgba(0,0,0,.45);
      --good: #29d38a;
      --bad: #ff5a6a;
      --accent: #7aa7ff;
      --r: 18px;
      --qrPad: 18px; /* quiet zone real */
    }

    html[data-theme="light"]{
      --bg: #f6f8ff;
      --fg: rgba(10,16,32,.92);
      --muted: rgba(10,16,32,.65);
      --card: rgba(10,16,32,.06);
      --line: rgba(10,16,32,.12);
      --shadow: 0 18px 40px rgba(10,16,32,.12);
      --good: #0c9b61;
      --bad: #d1354b;
      --accent: #2b59ff;
    }

    *{ box-sizing:border-box; }
    html, body { width:100%; overflow-x:hidden; }
    body{
      margin:0; min-height:100dvh; color:var(--fg);
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:
        radial-gradient(1200px 700px at 20% 0%, rgba(122,167,255,.20), transparent 60%),
        radial-gradient(900px 600px at 90% 10%, rgba(41,211,138,.16), transparent 55%),
        radial-gradient(900px 700px at 50% 100%, rgba(255,90,106,.12), transparent 55%),
        var(--bg);
    }
    .wrap{ max-width: 860px; margin:0 auto; padding: 14px 14px 28px; }
    header{
      position: sticky; top: 10px; z-index: 5;
      display:flex; justify-content:space-between; align-items:center; gap:12px;
      padding: 12px 12px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .brand{ display:flex; flex-direction:column; gap:2px; }
    .brand h1{ margin:0; font-size: 16px; letter-spacing:.2px; }
    .brand .sub{ font-size: 12px; color: var(--muted); }

    .pill{
      display:flex; align-items:center; gap:8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(0,0,0,.08);
      color: var(--muted);
      font-size: 13px;
      white-space: nowrap;
    }
    .dot{ width:10px; height:10px; border-radius:999px; background: var(--bad); box-shadow: 0 0 0 4px color-mix(in oklab, var(--bad) 25%, transparent); }
    .dot.ok{ background: var(--good); box-shadow: 0 0 0 4px color-mix(in oklab, var(--good) 25%, transparent); }

    .grid{ display:grid; gap:14px; margin-top:14px; grid-template-columns: 1fr; }
    @media (min-width: 860px){ .grid{ grid-template-columns: 1.1fr .9fr; } }

    .card{
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
      box-shadow: var(--shadow);
      overflow: visible; /* IMPORTANTE: no recortar QR */
    }
    .card h2{
      margin:0; padding: 12px 14px;
      font-size: 14px; letter-spacing:.2px;
      border-bottom: 1px solid var(--line);
    }
    .body{ padding: 14px; }

    button{
      appearance:none; border:1px solid var(--line);
      background: rgba(255,255,255,.08);
      color: var(--fg);
      border-radius: 14px;
      padding: 14px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing:.2px;
      transition: transform .06s ease, background .2s ease;
      touch-action: manipulation;
    }
    button:active{ transform: scale(.99); }
    .primary{ background: linear-gradient(180deg, color-mix(in oklab, var(--accent) 28%, transparent), rgba(255,255,255,.06)); }
    .secondary{ background: linear-gradient(180deg, color-mix(in oklab, var(--good) 22%, transparent), rgba(255,255,255,.06)); }
    .ghost{ background: rgba(0,0,0,.08); }

    .actions{ display:grid; gap:10px; grid-template-columns:1fr; }
    @media (min-width: 520px){ .actions{ grid-template-columns: 1fr 1fr; } }

    .hint{ margin-top:10px; color:var(--muted); font-size:12px; line-height:1.35; }

    .qrStage{
      display:flex; flex-direction:column; align-items:center; gap:10px;
      margin-top: 10px;
      padding: 12px;
      border: 1px dashed color-mix(in oklab, var(--line) 90%, transparent);
      border-radius: 16px;
      background: rgba(0,0,0,.06);
    }
    #progress{ font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
    #qr {
      width: 100%;
      display: flex;
      justify-content: center;
    }
    
    #qr img {
      width: min(90vw, 420px);
      height: auto;
      background: white;
      padding: 16px;
      box-sizing: content-box;
    }
    
    
    .row{ display:flex; gap:10px; width:100%; flex-wrap:wrap; justify-content:center; }
    .row button{ flex:1; min-width: 140px; }

    .scanBox{
      display:flex; flex-direction:column; gap:10px;
      padding: 12px;
      border-radius: 16px;
      background: rgba(0,0,0,.06);
      border: 1px solid var(--line);
    }
    video{
      width:100%;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.18);
      aspect-ratio: 16 / 10;
      object-fit: cover;
    }
    .log{
      margin-top: 12px;
      max-height: 220px;
      overflow:auto;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,.08);
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: var(--muted);
    }

    .rightHeader{
      display:flex; align-items:center; gap:10px;
    }
    .toggle{
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.08);
      font-size: 13px;
      color: var(--fg);
    }

    /* IDs usados por JS */
    #status.ok{ color: var(--good); font-weight: 700; }
    #status.bad{ color: var(--bad); font-weight: 700; }
  </style>

  <!-- QR generator (estable) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Compresión -->
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <!-- QR scanner -->
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
</head>

<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Hundir la flota</h1>
        <div class="sub">Emparejamiento LAN por QR (trozos) · sin backend</div>
      </div>
      <div class="rightHeader">
        <button id="themeBtn" class="toggle" type="button">🌙/☀️</button>
        <div class="pill">
          <span id="connDot" class="dot"></span>
          <span id="status" class="bad">Desconectado</span>
        </div>
      </div>
    </header>

    <div class="grid">
      <section class="card">
        <h2>1) Rol y QR</h2>
        <div class="body">
          <div class="actions">
            <button id="btnHost" class="primary">Crear partida (Host)</button>
            <button id="btnJoin" class="secondary">Unirme (Cliente)</button>
          </div>

          <div id="role" class="hint">Rol: —</div>

          <div class="qrStage">
            <div id="progress">—</div>
            <div id="qr"></div>
            <div class="row">
              <button id="prev" class="ghost" type="button">◀ Anterior</button>
              <button id="next" class="ghost" type="button">Siguiente ▶</button>
            </div>
            <div class="hint">
              Consejo: brillo al 100% en el móvil que muestra el QR. Distancia 20–35 cm.
            </div>
          </div>
        </div>
      </section>

      <aside class="card">
        <h2>2) Cámara y logs</h2>
        <div class="body">
          <div class="scanBox">
            <video id="video" muted playsinline></video>
            <button id="btnCam" class="ghost" type="button">Abrir cámara (trasera)</button>
            <div class="hint">Si no escanea: limpia lente + sube brillo + aléjate un poco.</div>
          </div>

          <div id="log" class="log"></div>
        </div>
      </aside>
    </div>
  </div>

  <script src="pair.js"></script>

  <script>
    // UI: punto verde/rojo según clase del status
    const dot = document.getElementById("connDot");
    const st  = document.getElementById("status");
    new MutationObserver(() => {
      dot.className = "dot " + (st.classList.contains("ok") ? "ok" : "");
    }).observe(st, { attributes:true, attributeFilter:["class"] });

    // Dark/Light toggle con persistencia
    const KEY="battleship_theme_v1";
    const btn=document.getElementById("themeBtn");
    const apply=(t)=>document.documentElement.setAttribute("data-theme", t);
    const saved=localStorage.getItem(KEY) || "dark";
    apply(saved);
    btn.onclick=()=>{ const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"; apply(t); localStorage.setItem(KEY,t); };
  </script>
</body>
</html>
