<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hundir la flota · LAN</title>

  <style>
    body { font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial; margin:16px; }
    button { font-size:18px; padding:14px; width:100%; margin:8px 0; }
    .card { border:1px solid #ddd; border-radius:14px; padding:14px; margin:10px 0; }
    #qr { display:flex; justify-content:center; }
    #qr img { width:min(320px,85vw); }
    video { width:100%; border-radius:12px; border:1px solid #ddd; }
    .ok { color:#0a7; font-weight:700; }
    .bad { color:#c33; font-weight:700; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; }
  </style>

  <!-- QR generator (estable) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- QR scanner -->
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
</head>
<body>

<h2>Hundir la flota · LAN Wi-Fi - X</h2>

<div class="card">
  <button id="btnHost">Crear partida (Host)</button>
  <button id="btnJoin">Unirme (Cliente)</button>
</div>

<div class="card">
  Estado: <span id="status" class="bad">Desconectado</span><br>
  <span id="role"></span>
</div>

<div class="card">
  <h3>QR</h3>
  <div id="qr"></div>
</div>

<div class="card">
  <h3>Escáner</h3>
  <video id="video" muted playsinline></video>
  <button id="btnCam">Abrir cámara</button>
</div>

<div class="card mono">
  <div id="log"></div>
</div>

<script src="lan.js"></script>
</body>
</html>
