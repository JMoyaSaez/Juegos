<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hundir la flota · LAN</title>

<style>
:root{
  --bg:#0b1020; --fg:#fff; --muted:#9aa3b2;
  --card:#141a2e; --line:#2a3150;
  --good:#29d38a; --bad:#ff5a6a;
}
html[data-theme="light"]{
  --bg:#f4f6ff; --fg:#0b1020; --muted:#555;
  --card:#fff; --line:#ddd;
}
body{
  margin:0; font-family:system-ui;
  background:var(--bg); color:var(--fg);
}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
}
button{
  width:100%; padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--fg);
  font-size:16px;
}
#qr img{
  width:min(90vw,360px);
  background:#fff;
  padding:16px;
  border-radius:12px;
}
video{
  width:100%;
  border-radius:14px;
  background:#000;
}
.ok{color:var(--good)}
.bad{color:var(--bad)}
.small{font-size:13px;color:var(--muted)}
</style>

<!-- QR generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- QR reader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

</head>
<body>

<div class="wrap">

  <!-- HEADER -->
  <div class="card">
    <strong>Hundir la flota</strong><br>
    Estado: <span id="status" class="bad">Idle</span><br>
    <span id="role" class="small">Rol: —</span>
    <button id="themeBtn" style="margin-top:8px">🌙 / ☀️</button>
  </div>

  <!-- ACTIONS -->
  <div class="card">
    <button id="btnHost">Crear partida (Host)</button>
    <button id="btnJoin" style="margin-top:8px">Unirse a partida</button>
  </div>

  <!-- QR -->
  <div class="card" style="text-align:center">
    <div id="qr"></div>
    <div id="qrInfo" class="small"></div>
  </div>

  <!-- CAMERA -->
  <div class="card">
    <div id="reader"></div>
    <button id="btnCam">Abrir cámara</button>
  </div>

</div>

<script>
/* ===== Dark / Light ===== */
const KEY="theme";
document.documentElement.dataset.theme =
  localStorage.getItem(KEY) || "dark";

document.getElementById("themeBtn").onclick = () => {
  const t = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  localStorage.setItem(KEY,t);
};

/* ===== Helpers ===== */
const $ = id => document.getElementById(id);
const statusEl = $("status");
const roleEl = $("role");
const qrEl = $("qr");
const qrInfoEl = $("qrInfo");

function setStatus(ok, text){
  statusEl.textContent = text;
  statusEl.className = ok ? "ok" : "bad";
}

/* ===== ID de partida ===== */
function newGameId(){
  return Math.random().toString(36).slice(2,8).toUpperCase();
}

/* ===== QR Generator ===== */
function showQR(text){
  qrEl.innerHTML = "";
  new QRCode(qrEl,{
    text,
    width: 320,
    height: 320,
    correctLevel: QRCode.CorrectLevel.L
  });
}

/* ===== HTML5 QR Reader ===== */
const scanner = new Html5Qrcode("reader");

/* ===== HOST ===== */
$("btnHost").onclick = () => {
  const gameId = newGameId();
  const payload = `BATTLESHIP|HOST|${gameId}`;

  showQR(payload);
  roleEl.textContent = "Rol: HOST";
  qrInfoEl.textContent = `ID partida: ${gameId}`;
  setStatus(true, "Esperando jugador…");
};

/* ===== CLIENT ===== */
$("btnJoin").onclick = () => {
  roleEl.textContent = "Rol: CLIENTE";
  setStatus(false, "Escanea el QR del host");
};

/* ===== CAMERA ===== */
$("btnCam").onclick = async () => {
  setStatus(false, "Escaneando…");

  await scanner.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    text => {
      if(!text.startsWith("BATTLESHIP|HOST|")) return;

      const [, , gameId] = text.split("|");
      scanner.stop();

      roleEl.textContent = "Rol: CLIENTE";
      setStatus(true, `Unido a la partida ${gameId}`);
      qrInfoEl.textContent = `ID partida: ${gameId}`;
    }
  );
};
</script>

</body>
</html>
