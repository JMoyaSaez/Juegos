<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hundir la flota · Emparejar</title>

<style>
:root{
  --bg:#0b1020; --fg:#fff; --muted:#9aa3b2;
  --card:#141a2e; --line:#2a3150;
  --good:#29d38a; --bad:#ff5a6a;
}
html[data-theme="light"]{
  --bg:#f4f6ff; --fg:#0b1020; --muted:#555;
  --card:#fff; --line:#ddd;
}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--fg)}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
button{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:16px}
#qr img{width:min(90vw,340px);background:#fff;padding:16px;border-radius:12px}
video{width:100%;border-radius:14px;background:#000}
.ok{color:var(--good)} .bad{color:var(--bad)} .small{color:var(--muted);font-size:13px}
</style>

<!-- QR generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- QR reader (fiable) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<!-- ✅ compresión -->
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

</head>
<body>

<div class="wrap">

  <div class="card">
    <strong>Hundir la flota</strong><br>
    Estado: <span id="status" class="bad">Idle</span><br>
    <span id="role" class="small">Rol: —</span>
    <button id="themeBtn" style="margin-top:8px">🌙 / ☀️</button>
  </div>

  <div class="card">
    <button id="btnHost">Crear partida (Host)</button>
    <button id="btnJoin" style="margin-top:8px">Unirse a partida</button>
  </div>

  <div class="card" style="text-align:center">
    <div id="qr"></div>
    <div id="qrInfo" class="small"></div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <button id="btnCam">Abrir cámara</button>
  </div>

</div>

<script>
/* ================= THEME ================= */
const KEY="theme";
document.documentElement.dataset.theme = localStorage.getItem(KEY) || "dark";
document.getElementById("themeBtn").onclick = () => {
  const t = document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=t; localStorage.setItem(KEY,t);
};

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const statusEl=$("status"), roleEl=$("role"), qrEl=$("qr"), qrInfoEl=$("qrInfo");
const setStatus=(ok,t)=>{statusEl.textContent=t;statusEl.className=ok?"ok":"bad";};
function showQR(text){
  qrEl.innerHTML="";
  new QRCode(qrEl,{text,width:320,height:320,correctLevel:QRCode.CorrectLevel.L});
}

/* ================= COMPRESSION (pako + base64url) ================= */
function u8ToB64url(u8){
  let s=""; for(let i=0;i<u8.length;i++) s+=String.fromCharCode(u8[i]);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlToU8(b){
  const b64=b.replace(/-/g,"+").replace(/_/g,"/") + "===".slice((b.length+3)%4);
  const bin=atob(b64);
  const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
  return u8;
}
function pack(obj){
  const json = JSON.stringify(obj);
  const def  = pako.deflate(json);
  return u8ToB64url(def);
}
function unpack(b64u){
  const u8 = b64urlToU8(b64u);
  const json = pako.inflate(u8,{to:"string"});
  return JSON.parse(json);
}

/* ================= WEBRTC ================= */
let pc, dc;
const cfg = { iceServers: [] };

function waitIceComplete(pc){
  return new Promise(resolve=>{
    if (pc.iceGatheringState==="complete") return resolve();
    pc.addEventListener("icecandidate", e => { if(!e.candidate) resolve(); }, { once:false });
    pc.addEventListener("icegatheringstatechange", () => {
      if(pc.iceGatheringState==="complete") resolve();
    });
  });
}

/* ================= SCANNER ================= */
const scanner = new Html5Qrcode("reader");

/* ================= HOST ================= */
$("btnHost").onclick = async ()=>{
  roleEl.textContent="Rol: HOST";
  setStatus(false,"Creando offer (espera 1–5s)…");

  pc = new RTCPeerConnection(cfg);
  dc = pc.createDataChannel("game");
  dc.onopen = ()=>goGame();

  await pc.setLocalDescription(await pc.createOffer());
  await waitIceComplete(pc);

  const payload = pack(pc.localDescription);
  showQR("OFFER|" + payload);
  qrInfoEl.textContent = "QR de oferta (OFFER)";
  setStatus(false,"Cliente escanea el QR");
};

/* ================= CLIENT ================= */
$("btnJoin").onclick = ()=>{
  roleEl.textContent="Rol: CLIENTE";
  setStatus(false,"Escanea el QR del host");
};

$("btnCam").onclick = async ()=>{
  setStatus(false,"Escaneando…");

  await scanner.start(
    { facingMode:"environment" },
    { fps:10, qrbox:250 },
    async text=>{
      // IMPORTANTE: parar cámara en cuanto leemos
      await scanner.stop();

      // CLIENT recibe OFFER
      if(text.startsWith("OFFER|")){
        roleEl.textContent="Rol: CLIENTE";
        setStatus(false,"Generando answer (espera 1–5s)…");

        const offer = unpack(text.slice(6));

        pc = new RTCPeerConnection(cfg);
        pc.ondatachannel = e => { dc=e.channel; dc.onopen=()=>goGame(); };

        await pc.setRemoteDescription(offer);
        await pc.setLocalDescription(await pc.createAnswer());
        await waitIceComplete(pc);

        const payload = pack(pc.localDescription);
        showQR("ANSWER|" + payload);
        qrInfoEl.textContent = "QR de respuesta (ANSWER)";
        setStatus(false,"Enseña este QR al host");
        return;
      }

      // HOST recibe ANSWER (el host también puede pulsar cámara y escanear)
      if(text.startsWith("ANSWER|")){
        if(!pc){
          setStatus(false,"Primero crea partida en este dispositivo (HOST).");
          return;
        }
        const answer = unpack(text.slice(7));
        await pc.setRemoteDescription(answer);
        qrInfoEl.textContent = "Answer aplicada";
        setStatus(false,"Conectando…");
        return;
      }

      setStatus(false,"QR no reconocido");
    }
  );
};

function goGame(){
  setStatus(true,"Conectado ✅");
  setTimeout(()=>location.href="game.html", 400);
}
</script>

</body>
</html>
