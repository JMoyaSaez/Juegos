<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Hundir la flota · Emparejar</title>

  <style>
    body{margin:0;font-family:system-ui;background:#0b1020;color:#fff}
    .wrap{max-width:720px;margin:0 auto;padding:16px}
    .card{border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.06);padding:14px;margin:12px 0}
    button{width:100%;padding:14px;font-size:16px;border-radius:14px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff}
    #qr {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #qr img,
    #qr canvas {
      width: min(92vw, 420px);
      height: auto;
      background: #ffffff;
      padding: 16px;              /* ← quiet zone REAL */
      box-sizing: content-box;    /* ← clave */
      border-radius: 12px;
    }
    video{width:100%;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#000;aspect-ratio:16/10;object-fit:cover}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    .pill{padding:6px 10px;border:1px solid rgba(255,255,255,.12);border-radius:999px;color:rgba(255,255,255,.75);font-size:12px}
    .ok{color:#29d38a;font-weight:700}
    .bad{color:#ff5a6a;font-weight:700}
    .mono{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:rgba(255,255,255,.75)}
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="row">
      <span class="pill">Modo LAN</span>
      <span class="pill">QR por partes</span>
      <span class="pill">Brillo alto</span>
    </div>
    <h2 style="margin:10px 0 0">Emparejar</h2>
    Estado: <span id="status" class="bad">Desconectado</span>
    <div id="role" class="mono" style="margin-top:6px;">Rol: —</div>
  </div>

  <div class="card">
    <button id="btnHost">Crear partida (Host)</button>
    <button id="btnJoin" style="margin-top:10px;">Unirme (Cliente)</button>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px;">QR</h3>
    <div id="progress" class="mono">—</div>
    <div id="qr" style="display:flex;justify-content:center;margin-top:10px;"></div>
    <div class="row" style="margin-top:10px;">
      <button id="prev" style="flex:1;min-width:140px;">◀ Anterior</button>
      <button id="next" style="flex:1;min-width:140px;">Siguiente ▶</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 10px;">Cámara</h3>
    <video id="video" muted playsinline></video>
    <button id="btnCam" style="margin-top:10px;">Abrir cámara</button>
    <div id="log" class="mono" style="margin-top:10px;max-height:140px;overflow:auto;"></div>
  </div>

</div>

<script src="pair.js"></script>
</body>
</html>
