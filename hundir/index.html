<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hundir la flota · Emparejar</title>

<style>
:root{
  --bg:#0b1020; --fg:#fff; --muted:#9aa3b2;
  --card:#141a2e; --line:#2a3150;
  --good:#29d38a; --bad:#ff5a6a;
}
html[data-theme="light"]{
  --bg:#f4f6ff; --fg:#0b1020; --muted:#555;
  --card:#fff; --line:#ddd;
}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--fg)}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
button{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:16px}
#qr img{width:min(90vw,340px);background:#fff;padding:16px;border-radius:12px}
video{width:100%;border-radius:14px;background:#000}
.ok{color:var(--good)} .bad{color:var(--bad)} .small{color:var(--muted);font-size:13px}
</style>

<!-- QR generator -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<!-- QR reader -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

</head>
<body>

<div class="wrap">

  <div class="card">
    <strong>Hundir la flota</strong><br>
    Estado: <span id="status" class="bad">Idle</span><br>
    <span id="role" class="small">Rol: —</span>
    <button id="themeBtn" style="margin-top:8px">🌙 / ☀️</button>
  </div>

  <div class="card">
    <button id="btnHost">Crear partida (Host)</button>
    <button id="btnJoin" style="margin-top:8px">Unirse a partida</button>
  </div>

  <div class="card" style="text-align:center">
    <div id="qr"></div>
    <div id="qrInfo" class="small"></div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <button id="btnCam">Abrir cámara</button>
  </div>

</div>

<script>
/* ================= THEME ================= */
const KEY="theme";
document.documentElement.dataset.theme = localStorage.getItem(KEY) || "dark";
document.getElementById("themeBtn").onclick = () => {
  const t = document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=t; localStorage.setItem(KEY,t);
};

/* ================= HELPERS ================= */
const $ = id => document.getElementById(id);
const statusEl=$("status"), roleEl=$("role"), qrEl=$("qr"), qrInfoEl=$("qrInfo");
const setStatus=(ok,t)=>{statusEl.textContent=t;statusEl.className=ok?"ok":"bad";};

/* ================= QR ================= */
function showQR(text){
  qrEl.innerHTML="";
  new QRCode(qrEl,{text,width:320,height:320,correctLevel:QRCode.CorrectLevel.L});
}

/* ================= WEBRTC ================= */
let pc, dc;
const cfg={iceServers:[]};

function waitIce(pc){
  return new Promise(r=>{
    if(pc.iceGatheringState==="complete") r();
    pc.onicecandidate=e=>!e.candidate&&r();
  });
}

/* ================= SCANNER ================= */
const scanner=new Html5Qrcode("reader");

/* ================= HOST ================= */
$("btnHost").onclick=async()=>{
  roleEl.textContent="Rol: HOST";
  setStatus(false,"Creando offer…");

  pc=new RTCPeerConnection(cfg);
  dc=pc.createDataChannel("game");
  dc.onopen=()=>goGame();

  await pc.setLocalDescription(await pc.createOffer());
  await waitIce(pc);

  showQR("OFFER|"+btoa(JSON.stringify(pc.localDescription)));
  setStatus(false,"Cliente escanea el QR");
};

/* ================= CLIENT ================= */
$("btnJoin").onclick=()=>{
  roleEl.textContent="Rol: CLIENTE";
  setStatus(false,"Escanea el QR del host");
};

$("btnCam").onclick=async()=>{
  setStatus(false,"Escaneando…");
  await scanner.start(
    {facingMode:"environment"},
    {fps:10,qrbox:250},
    async text=>{
      scanner.stop();

      /* CLIENT recibe OFFER */
      if(text.startsWith("OFFER|")){
        const offer=JSON.parse(atob(text.slice(6)));
        pc=new RTCPeerConnection(cfg);
        pc.ondatachannel=e=>{dc=e.channel;dc.onopen=()=>goGame();};

        await pc.setRemoteDescription(offer);
        await pc.setLocalDescription(await pc.createAnswer());
        await waitIce(pc);

        showQR("ANSWER|"+btoa(JSON.stringify(pc.localDescription)));
        setStatus(false,"Enseña este QR al host");
      }

      /* HOST recibe ANSWER */
      if(text.startsWith("ANSWER|")){
        const answer=JSON.parse(atob(text.slice(7)));
        await pc.setRemoteDescription(answer);
        setStatus(false,"Conectando…");
      }
    }
  );
};

function goGame(){
  setStatus(true,"Conectado");
  setTimeout(()=>location.href="game.html",500);
}
</script>

</body>
</html>
