<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hundir la flota · Emparejar</title>

  <style>
    :root{
      --bg:#0b1020; --fg:#fff; --muted:#9aa3b2;
      --card:#141a2e; --line:#2a3150; --good:#29d38a; --bad:#ff5a6a;
    }
    html[data-theme="light"]{
      --bg:#f4f6ff; --fg:#0b1020; --muted:#555;
      --card:#fff; --line:#ddd;
    }
    body{
      margin:0; font-family:system-ui;
      background:var(--bg); color:var(--fg);
    }
    .wrap{max-width:720px;margin:auto;padding:16px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
    button{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:#0000;color:var(--fg);font-size:16px}
    #qr img{width:min(90vw,420px);background:#fff;padding:16px;border-radius:12px}
    video{width:100%;border-radius:14px;background:#000}
    .row{display:flex;gap:10px}
    .ok{color:var(--good)} .bad{color:var(--bad)}
  </style>

  <!-- QR generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- 🔥 LECTOR FIABLE -->
  <script src="https://unpkg.com/html5-qrcode@2.3.9/html5-qrcode.min.js"></script>

  <!-- Compresión -->
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
</head>
<body>

<div class="wrap">

  <div class="card">
    <strong>Hundir la flota</strong><br>
    Estado: <span id="status" class="bad">Desconectado</span>
    <div id="role"></div>
    <button id="themeBtn">🌙 / ☀️</button>
  </div>

  <div class="card">
    <button id="btnHost">Crear partida (Host)</button>
    <button id="btnJoin" style="margin-top:8px">Unirme (Cliente)</button>
  </div>

  <div class="card" style="text-align:center">
    <div id="qr"></div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <button id="btnCam">Abrir cámara</button>
  </div>

</div>

<script src="pair.js"></script>
</body>
</html>
