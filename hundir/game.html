<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Hundir la flota · Juego</title>
  <style>
    :root{
      --bg:#0b1020; --fg:rgba(255,255,255,.92); --muted:rgba(255,255,255,.7);
      --card:rgba(255,255,255,.07); --line:rgba(255,255,255,.12); --shadow:0 16px 50px rgba(0,0,0,.45);
      --r:18px;
    }
    html[data-theme="light"]{
      --bg:#f6f8ff; --fg:rgba(10,16,32,.92); --muted:rgba(10,16,32,.65);
      --card:rgba(10,16,32,.06); --line:rgba(10,16,32,.12); --shadow:0 18px 40px rgba(10,16,32,.12);
    }
    body{ margin:0; min-height:100dvh; display:grid; place-items:center; font-family:system-ui; background:var(--bg); color:var(--fg); }
    .card{ width:min(560px, 92vw); border:1px solid var(--line); background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; }
    .top{ display:flex; justify-content:space-between; align-items:center; gap:10px; }
    button{ border:1px solid var(--line); background:rgba(255,255,255,.08); color:var(--fg); border-radius:999px; padding:8px 10px; }
    .muted{ color:var(--muted); font-size:12px; margin-top:6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top">
      <div>
        <div style="font-weight:800;font-size:18px">Conectado ✅</div>
        <div class="muted">Aquí ya cargas tu tablero real (10×10) y lógica del juego.</div>
      </div>
      <button id="themeBtn" type="button">🌙/☀️</button>
    </div>
    <hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
    <div class="muted">
      Siguiente paso: mover tu UI de Hundir la flota aquí y usar el DataChannel ya abierto.
    </div>
  </div>

  <script>
    const KEY="battleship_theme_v1";
    const apply=(t)=>document.documentElement.setAttribute("data-theme", t);
    apply(localStorage.getItem(KEY) || "dark");
    document.getElementById("themeBtn").onclick=()=>{
      const t=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
      apply(t); localStorage.setItem(KEY,t);
    };
  </script>
</body>
</html>
