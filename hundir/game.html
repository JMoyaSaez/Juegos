<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hundir la flota · LAN</title>

<style>
:root{
  --bg:#0b1020; --fg:#fff; --muted:#9aa3b2;
  --card:#141a2e; --line:#2a3150;
  --good:#29d38a; --bad:#ff5a6a;
  --sea:#0e3a5e; --ship:#7aa7ff;
  --hit:#ff5a6a; --miss:#7fd3ff;
}
html[data-theme="light"]{
  --bg:#f4f6ff; --fg:#0b1020; --muted:#555;
  --card:#fff; --line:#ddd;
  --sea:#cfe8ff; --ship:#2b59ff;
  --hit:#d1354b; --miss:#5bb6ff;
}
body{
  margin:0; font-family:system-ui;
  background:var(--bg); color:var(--fg);
}
.wrap{max-width:720px;margin:auto;padding:16px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:14px;
}
header{display:flex;justify-content:space-between;align-items:center}
button{
  width:100%; padding:14px;
  border-radius:14px;
  border:1px solid var(--line);
  background:transparent;
  color:var(--fg);
  font-size:16px;
}
.small{font-size:13px;color:var(--muted)}
.ok{color:var(--good)} .bad{color:var(--bad)}

.grid{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:4px;
  margin-top:10px;
}
.cell{
  aspect-ratio:1/1;
  background:var(--sea);
  border-radius:6px;
  position:relative;
  overflow:hidden;
}
.cell.ship{background:var(--ship)}
.cell.hit{background:var(--hit)}
.cell.miss{background:var(--miss)}

@keyframes wave {
  0%{transform:translateY(0)}
  50%{transform:translateY(-1.6px)}
  100%{transform:translateY(0)}
}
.cell::after{
  content:"";
  position:absolute;
  inset:-40%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.12), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.08), transparent 50%);
  opacity:.55;
  animation:wave 3s ease-in-out infinite;
}
.cell:nth-child(3n)::after{animation-duration:3.4s}
.cell:nth-child(4n)::after{animation-duration:2.8s}
.cell.hit::after,
.cell.miss::after{display:none}
.cell.ship::after{opacity:.25}

.two{
  display:grid; gap:12px;
}
@media(min-width:720px){
  .two{grid-template-columns:1fr 1fr}
}
.locked{opacity:.6;pointer-events:none}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

</head>
<body>

<div class="wrap">

<div class="card">
  <header>
    <div>
      <strong>Hundir la flota</strong><br>
      Estado: <span id="status" class="bad">Idle</span><br>
      <span id="role" class="small">Rol: —</span>
    </div>
    <div style="display:flex;gap:8px">
      <button id="themeBtn" style="width:auto">🌙/☀️</button>
      <button id="audioBtn" style="width:auto">🔊</button>
    </div>
  </header>
</div>

<div id="pairView" class="card">
  <button id="btnHost">Crear partida (Host)</button>
  <button id="btnJoin" style="margin-top:8px">Unirse</button>
  <div id="qr" style="text-align:center;margin-top:10px"></div>
  <div id="reader"></div>
  <button id="btnCam">Abrir cámara</button>
</div>

<div id="gameView" class="card" style="display:none">
  <div class="two">
    <div>
      <strong>Tu flota</strong>
      <div id="defBoard" class="grid"></div>
      <button id="btnRandom">🔄 Cambiar barcos</button>
      <button id="btnReady">✅ Listo</button>
    </div>
    <div>
      <strong>Disparos</strong>
      <div id="atkBoard" class="grid"></div>
    </div>
  </div>
</div>

</div>

<script>
/* ========= TEMA ========= */
const THEME="theme";
document.documentElement.dataset.theme=localStorage.getItem(THEME)||"dark";
themeBtn.onclick=()=>{
  const t=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=t;localStorage.setItem(THEME,t);
};

/* ========= AUDIO ========= */
let audioCtx;
audioBtn.onclick=()=>{
  audioCtx=new (window.AudioContext||webkitAudioContext)();
  beep(800,.08,.06);
};
function beep(f,d,v){
  if(!audioCtx) return;
  const o=audioCtx.createOscillator(), g=audioCtx.createGain();
  o.frequency.value=f; g.gain.value=v;
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); setTimeout(()=>o.stop(),d*1000);
}
function hitSound(){beep(220,.08,.08)}
function missSound(){beep(700,.05,.05)}
function sunkSound(){
  beep(140,.1,.1);
  setTimeout(()=>beep(110,.14,.1),90);
  setTimeout(()=>beep(85,.18,.1),210);
}

/* ========= ESTADO ========= */
const SIZE=10, SHIPS=[5,4,3,3,2];
let state={
  def:Array(100).fill(0),
  atk:Array(100).fill(0),
  shipId:Array(100).fill(-1),
  turn:true, // true = tu turno
  ready:false
};

/* ========= TABLERO ========= */
const defBoard=defBoardEl=document.getElementById("defBoard");
const atkBoard=atkBoardEl=document.getElementById("atkBoard");
function idx(r,c){return r*SIZE+c}

function placeShips(){
  state.def.fill(0);
  state.shipId.fill(-1);
  let sid=0;
  for(const len of SHIPS){
    let ok=false;
    while(!ok){
      const h=Math.random()<.5;
      const r=Math.floor(Math.random()*SIZE);
      const c=Math.floor(Math.random()*SIZE);
      ok=true;
      for(let i=0;i<len;i++){
        const rr=r+(h?0:i), cc=c+(h?i:0);
        if(rr>=SIZE||cc>=SIZE||state.def[idx(rr,cc)]) ok=false;
      }
      if(ok){
        for(let i=0;i<len;i++){
          const rr=r+(h?0:i), cc=c+(h?i:0);
          const k=idx(rr,cc);
          state.def[k]=1;
          state.shipId[k]=sid;
        }
        sid++;
      }
    }
  }
  render();
}

function render(){
  defBoard.innerHTML="";
  atkBoard.innerHTML="";
  state.def.forEach(v=>{
    const d=document.createElement("div");
    d.className="cell"+(v===1?" ship":v===2?" hit":v===3?" miss":"");
    defBoard.appendChild(d);
  });
  state.atk.forEach((v,i)=>{
    const d=document.createElement("div");
    d.className="cell"+(v===2?" hit":v===3?" miss":"");
    d.onclick=()=>shoot(i);
    atkBoard.appendChild(d);
  });
}

function isSunk(id){
  return state.shipId.every((v,i)=>v!==id||state.def[i]!==1);
}

function shoot(i){
  if(state.atk[i]) return;
  if(state.def[i]===1){
    state.def[i]=2;
    state.atk[i]=2;
    if(isSunk(state.shipId[i])) sunkSound();
    else hitSound();
  }else{
    state.def[i]=3;
    state.atk[i]=3;
    missSound();
  }
  render();
}

/* ========= INIT ========= */
placeShips();
render();
</script>

</body>
</html>
