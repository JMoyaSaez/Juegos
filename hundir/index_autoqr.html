<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>P2P QR Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- QR scan -->
<script src="https://unpkg.com/html5-qrcode"></script>

<!-- Compression -->
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>

<!-- QR generator -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>

<style>
body {
  font-family: system-ui, sans-serif;
  background: #111;
  color: #eee;
  margin: 0;
  padding: 16px;
  text-align: center;
}

button {
  font-size: 1.1rem;
  padding: 12px 18px;
  margin: 8px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
}

#qr {
  margin: 16px auto;
}

#reader {
  width: 280px;
  margin: 16px auto;
}

#status {
  margin-top: 12px;
  opacity: 0.85;
}
</style>
</head>

<body>

<h2>P2P 2 jugadores (sin servidor)</h2>

<button id="btnHost">Crear partida</button>
<button id="btnJoin">Unirse</button>
<button id="btnCam">Abrir cámara</button>

<div id="qr"></div>
<div id="reader"></div>
<div id="status"></div>

<script>
"use strict";

/* =======================
   UTILIDADES COMPRESIÓN
======================= */

function u8ToB64url(u8) {
  return btoa(String.fromCharCode.apply(null, u8))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function b64urlToU8(str) {
  str = str.replace(/-/g, "+").replace(/_/g, "/");
  while (str.length % 4) str += "=";
  const bin = atob(str);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

function packSDP(desc) {
  return u8ToB64url(
    pako.deflate(JSON.stringify([desc.type, desc.sdp]), { level: 9 })
  );
}

function unpackSDP(b64u) {
  const arr = JSON.parse(
    pako.inflate(b64urlToU8(b64u), { to: "string" })
  );
  return { type: arr[0], sdp: arr[1] };
}

/* =======================
   ESTADO
======================= */

const $ = id => document.getElementById(id);

let pc = null;
let scanner = new Html5Qrcode("reader");

/* =======================
   UI
======================= */

function setStatus(msg) {
  $("status").textContent = msg;
}

function showQR(text) {
  $("qr").innerHTML = "";
  QRCode.toCanvas(
    document.createElement("canvas"),
    text,
    { width: 260, margin: 1 },
    function (err, canvas) {
      if (!err) $("qr").appendChild(canvas);
    }
  );
}

/* =======================
   WEBRTC
======================= */

function createPC() {
  pc = new RTCPeerConnection();
  pc.onicecandidate = e => {
    if (!e.candidate) {
      const packed = packSDP(pc.localDescription);
      const prefix = pc.localDescription.type.toUpperCase();
      showQR(prefix + "|" + packed);
    }
  };
}

/* =======================
   QR SCAN
======================= */

async function startScan() {
  setStatus("Escaneando QR…");
  try {
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      async text => {
        await scanner.stop();
        await onQrText(text);
      }
    );
  } catch (e) {
    setStatus("No se pudo abrir la cámara");
  }
}

async function onQrText(text) {
  try {
    if (text.startsWith("OFFER|")) {
      const offer = unpackSDP(text.slice(6));
      createPC();
      await pc.setRemoteDescription(offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      setStatus("ANSWER generado. Enseña este QR al host.");
      return;
    }

    if (text.startsWith("ANSWER|")) {
      const answer = unpackSDP(text.slice(7));
      await pc.setRemoteDescription(answer);
      setStatus("Conectados 🎉");
      return;
    }

    setStatus("QR no reconocido");
  } catch (e) {
    setStatus("Error procesando QR");
  }
}

/* =======================
   BOTONES
======================= */

$("btnHost").onclick = async () => {
  setStatus("Creando partida…");
  createPC();
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  $("btnCam").textContent = "📷 Escanear ANSWER";
};

$("btnJoin").onclick = async () => {
  setStatus("Abriendo cámara…");
  await startScan();
};

$("btnCam").onclick = async () => {
  await startScan();
};
</script>

</body>
</html>
