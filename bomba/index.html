<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Host · Crear</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{
      --bg:#0b1020; --txt:rgba(255,255,255,.92); --mut:rgba(255,255,255,.68);
      --bd:rgba(255,255,255,.12); --card:rgba(255,255,255,.06);
      --acc:#66e3ff; --acc2:#8b5cff;
    }
    html[data-theme="light"]{
      --bg:#f6f7fb; --txt:rgba(0,0,0,.88); --mut:rgba(0,0,0,.62);
      --bd:rgba(0,0,0,.12); --card:rgba(0,0,0,.04);
      --acc:#0a63ff; --acc2:#6a36ff;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--txt);
      background: radial-gradient(900px 600px at 20% 10%, rgba(102,227,255,.14), transparent 55%),
                  radial-gradient(800px 500px at 80% 20%, rgba(139,92,255,.12), transparent 55%),
                  var(--bg);
    }
    .bar{
      width:min(720px, 94vw);
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 12px;
      border:1px solid var(--bd);
      border-radius: 14px;
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .left{display:flex; flex-direction:column; gap:2px; min-width:0}
    .room{font-weight:900; letter-spacing:.4px}
    .hint{font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .btn{
      appearance:none;
      border:1px solid var(--bd);
      background: rgba(255,255,255,.07);
      color:var(--txt);
      padding:10px 12px;
      border-radius: 12px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
    }
    .btn.primary{
      border-color:transparent;
      background: linear-gradient(135deg, rgba(102,227,255,.95), rgba(139,92,255,.95));
      color:#07101b;
    }
    html[data-theme="light"] .btn.primary{color:#fff}
    .btn:active{transform:translateY(1px)}
    .tiny{padding:10px 10px; min-width:44px}
  </style>
</head>
<body>
  <div class="bar">
    <div class="left">
      <div class="room">Sala: <span id="room">—</span></div>
      <div class="hint" id="hint">Generando link…</div>
    </div>

    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end">
      <button class="btn tiny" id="themeBtn" title="Dark/Light">🌗</button>
      <button class="btn" id="copyBtn">📋 Copiar</button>
      <button class="btn" id="waBtn">🟢 WhatsApp</button>
      <button class="btn primary" id="enterBtn">▶️ Entrar</button>
    </div>
  </div>

  <script>
    "use strict";

    const THEME_KEY = "jm_games_theme_v1";

    function loadTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
    }
    function toggleTheme(){
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
    }
    document.getElementById("themeBtn").addEventListener("click", toggleTheme);
    loadTheme();

    function randomRoomId(){
      const a = Math.random().toString(36).slice(2, 6);
      const b = Math.random().toString(36).slice(2, 6);
      return (a + "-" + b).toUpperCase();
    }

    const room = randomRoomId();
    document.getElementById("room").textContent = room;

    // base: carpeta actual (quita index.html si estuviera)
    const base = location.origin + location.pathname.replace(/index\.html?$/i, "");
    const invite = new URL(base + "game.html");
    invite.searchParams.set("room", room);
    invite.searchParams.set("role", "player");

    const hostUrl = new URL(base + "game.html");
    hostUrl.searchParams.set("room", room);
    hostUrl.searchParams.set("role", "host");

    document.getElementById("hint").textContent =
      `Pásalo por WhatsApp. Tú entras con “Entrar”. (${invite.toString()})`;

    async function copy(text){
      try { await navigator.clipboard.writeText(text); return true; }
      catch { return false; }
    }

    document.getElementById("copyBtn").addEventListener("click", async ()=>{
      const ok = await copy(invite.toString());
      if (!ok){
        alert("No pude copiar automáticamente. Mantén pulsado y copia el link del WhatsApp.");
      }
    });

    document.getElementById("waBtn").addEventListener("click", ()=>{
      const msg = encodeURIComponent(`🎮 Entra a la partida:\n${invite.toString()}`);
      window.open(`https://wa.me/?text=${msg}`, "_blank");
    });

    document.getElementById("enterBtn").addEventListener("click", ()=>{
      window.location.href = hostUrl.toString();
    });
  </script>
</body>
</html>
