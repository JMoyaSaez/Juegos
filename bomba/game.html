<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game</title>
  <meta name="color-scheme" content="dark light" />
  <style>
    :root{
      --bg:#0b1020; --txt:rgba(255,255,255,.92); --mut:rgba(255,255,255,.70);
      --bd:rgba(255,255,255,.12); --card:rgba(255,255,255,.06);
      --acc:#66e3ff; --acc2:#8b5cff; --good:#63f3a6;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
    }
    html[data-theme="light"]{
      --bg:#f6f7fb; --txt:rgba(0,0,0,.88); --mut:rgba(0,0,0,.62);
      --bd:rgba(0,0,0,.12); --card:rgba(0,0,0,.04);
      --acc:#0a63ff; --acc2:#6a36ff; --good:#0aa66a;
      --shadow: 0 18px 60px rgba(30,40,80,.18);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:var(--txt);
      background: radial-gradient(900px 600px at 20% 10%, rgba(102,227,255,.14), transparent 55%),
                  radial-gradient(800px 500px at 80% 20%, rgba(139,92,255,.12), transparent 55%),
                  var(--bg);
    }
    .top{
      width:min(980px, 94vw);
      margin: 12px auto 0;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 12px;
      border:1px solid var(--bd);
      border-radius: 14px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .meta{display:flex; flex-direction:column; gap:2px; min-width:0}
    .meta b{letter-spacing:.4px}
    .meta span{font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
    .btn{
      appearance:none; border:1px solid var(--bd);
      background: rgba(255,255,255,.07);
      color:var(--txt);
      padding:10px 12px;
      border-radius: 12px;
      font-weight:900;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, filter .2s ease;
    }
    .btn:active{transform:translateY(1px)}
    .btn:hover{filter:brightness(1.06)}
    .btn.primary{
      border-color:transparent;
      background: linear-gradient(135deg, rgba(102,227,255,.95), rgba(139,92,255,.95));
      color:#07101b;
    }
    html[data-theme="light"] .btn.primary{color:#fff}
    .wrap{
      width:min(980px, 94vw);
      margin: 14px auto 18px;
      display:grid;
      gap:14px;
    }
    .panel{
      border:1px solid var(--bd);
      background: var(--card);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding:14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transform: translateZ(0);
      transition: transform .2s ease;
    }
    .panel.boom{ animation: boom .35s ease-out; }
    @keyframes boom{ 0%{transform:scale(1)} 35%{transform:scale(1.02)} 100%{transform:scale(1)} }
    .status{
      display:flex; align-items:center; gap:10px; color:var(--mut); font-size:12px;
    }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: var(--good);
      box-shadow: 0 0 18px rgba(99,243,166,.25);
    }
  </style>
</head>
<body>

  <div class="top">
    <div class="meta">
      <div><b>Sala:</b> <span id="room">—</span> · <b>Rol:</b> <span id="role">—</span></div>
      <span id="hint">Listo. Aquí va el juego.</span>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end">
      <button class="btn" id="themeBtn" title="Dark/Light">🌗</button>
      <button class="btn" id="soundBtn" title="Sonido">🔊</button>
      <button class="btn primary" id="testBtn">💥 Test</button>
    </div>
  </div>

  <div class="wrap">
    <div class="panel" id="panel">
      <div class="status"><span class="dot"></span> Conectado (demo) · Sonido + animación OK</div>
      <p style="margin:10px 0 0; color:var(--mut); line-height:1.35">
        Aquí metemos el juego real. El host ya no necesita nada más: creó sala en index,
        compartió link, y entró a jugar.
      </p>
    </div>
  </div>

  <script>
    "use strict";

    const THEME_KEY = "jm_games_theme_v1";
    const SOUND_KEY = "jm_games_sound_v1";

    // theme
    function loadTheme(){
      const saved = localStorage.getItem(THEME_KEY);
      document.documentElement.setAttribute("data-theme", saved === "light" ? "light" : "dark");
    }
    function toggleTheme(){
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
    }
    document.getElementById("themeBtn").addEventListener("click", toggleTheme);
    loadTheme();

    // params
    const url = new URL(location.href);
    const room = (url.searchParams.get("room") || "").trim();
    const role = (url.searchParams.get("role") || "player").trim().toLowerCase();
    document.getElementById("room").textContent = room || "—";
    document.getElementById("role").textContent = room ? role : "—";
    document.getElementById("hint").textContent = room ? "Entraste a la sala. A jugar." : "Falta ?room=...";

    // sound (sintetizado)
    let soundEnabled = (localStorage.getItem(SOUND_KEY) ?? "1") === "1";
    const soundBtn = document.getElementById("soundBtn");
    function syncSound(){ soundBtn.textContent = soundEnabled ? "🔊" : "🔇"; }
    syncSound();
    soundBtn.addEventListener("click", ()=>{
      soundEnabled = !soundEnabled;
      localStorage.setItem(SOUND_KEY, soundEnabled ? "1" : "0");
      syncSound();
    });

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let ac = null;
    function ensureAudio(){
      if (!soundEnabled) return null;
      if (!ac) ac = new AudioCtx();
      if (ac.state === "suspended") ac.resume().catch(()=>{});
      return ac;
    }
    function whoosh(){
      const ctx = ensureAudio(); if (!ctx) return;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(900, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + 0.18);
      g.gain.setValueAtTime(0.001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.08, ctx.currentTime + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.2);
    }
    function explosion(){
      const ctx = ensureAudio(); if (!ctx) return;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(120, ctx.currentTime);
      o.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 0.22);
      g.gain.setValueAtTime(0.12, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      o.connect(g); g.connect(ctx.destination);
      o.start(); o.stop(ctx.currentTime + 0.28);
      if (navigator.vibrate) navigator.vibrate([20, 30, 40]);
    }

    // test button
    const panel = document.getElementById("panel");
    document.getElementById("testBtn").addEventListener("click", ()=>{
      // unlock audio on first gesture
      ensureAudio();
      panel.classList.remove("boom"); panel.offsetHeight; panel.classList.add("boom");
      whoosh(); setTimeout(explosion, 140);
    });

    // unlock audio on first user gesture
    window.addEventListener("pointerdown", ()=>{ ensureAudio(); }, { once:true });
  </script>
</body>
</html>
