<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Salto de esquí 3D - Prototipo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#111;
    color:#eee;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  #info{
    margin-bottom:8px;
    font-size:14px;
    text-align:center;
  }
  canvas{border-radius:8px;}
</style>
</head>
<body>
<div id="info">
  Salto de esquí 3D (prototipo)<br>
  ESPACIO: empezar salto · Flechas ↑↓: inclinar en el vuelo
</div>

<!-- Three.js desde CDN -->
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

<script>
  // Escena básica
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb); // cielo

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth*0.9, window.innerHeight*0.7);
  document.body.appendChild(renderer.domElement);

  // Luces
  const light = new THREE.DirectionalLight(0xffffff, 1.0);
  light.position.set(10,20,10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));

  // Rampa (un plano inclinado)
  const rampLength = 60;
  const rampGeometry = new THREE.BoxGeometry(4, 0.5, rampLength);
  const rampMaterial = new THREE.MeshPhongMaterial({color:0xffffff});
  const ramp = new THREE.Mesh(rampGeometry, rampMaterial);
  ramp.rotation.x = -Math.PI/8; // inclinar hacia abajo
  ramp.position.y = 0;
  ramp.position.z = -rampLength/2;
  scene.add(ramp);

  // Suelo/nevado de aterrizaje
  const groundGeometry = new THREE.PlaneGeometry(200,200);
  const groundMaterial = new THREE.MeshPhongMaterial({color:0xf0f0f0});
  const ground = new THREE.Mesh(groundGeometry, groundMaterial);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -10;
  ground.position.z = -120;
  scene.add(ground);

  // Esquiador muy simplificado: cuerpo + cabeza + esquís
  const skier = new THREE.Group();

  const bodyGeom = new THREE.BoxGeometry(0.6,1.5,0.4);
  const bodyMat = new THREE.MeshPhongMaterial({color:0x3333ff});
  const body = new THREE.Mesh(bodyGeom, bodyMat);
  body.position.y = 0.75;
  skier.add(body);

  const headGeom = new THREE.SphereGeometry(0.35, 16,16);
  const headMat = new THREE.MeshPhongMaterial({color:0xffddaa});
  const head = new THREE.Mesh(headGeom, headMat);
  head.position.y = 1.7;
  skier.add(head);

  const skiGeom = new THREE.BoxGeometry(0.15,0.1,2.2);
  const skiMat = new THREE.MeshPhongMaterial({color:0xff4444});
  const skiLeft = new THREE.Mesh(skiGeom, skiMat);
  const skiRight = new THREE.Mesh(skiGeom, skiMat);
  skiLeft.position.set(-0.25,0.1,0);
  skiRight.position.set(0.25,0.1,0);
  skier.add(skiLeft);
  skier.add(skiRight);

  // Posición inicial: sentado en la barandilla (arriba de la rampa)
  const startHeight = 2.0;
  const startZOnRamp = 2.0;
  skier.position.set(0, startHeight, startZOnRamp);

  scene.add(skier);

  // Estados del juego
  // "sitting" -> "running" -> "flying" -> "landed"
  let state = "sitting";
  let tRun = 0;   // tiempo bajando
  let tFly = 0;   // tiempo en el aire

  // Parámetros de la física simple
  const runDuration = 3.0;   // segundos bajando por el trampolín
  let speedRun = rampLength / runDuration; // "velocidad" a lo largo de la rampa
  let velY = 0;  // velocidad vertical durante vuelo
  let velZ = 0;  // velocidad hacia delante en vuelo
  const gravity = -9.8; // m/s^2 en "unidades" de escena escaladas
  let pitch = 0; // inclinación hacia delante/atrás

  const keys = {};
  window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if(e.key === " " && state === "sitting"){
      state = "running";
      tRun = 0;
    }
  });
  window.addEventListener("keyup", e => {
    keys[e.key] = false;
  });

  function updateSkier(delta){
    if(state === "sitting"){
      // Animación ligera de “respirar”
      const bob = Math.sin(performance.now()/500)*0.03;
      skier.position.y = startHeight + bob;
      // postura algo encogida
      skier.rotation.x = -0.3;
    }
    else if(state === "running"){
      tRun += delta;
      // Avanzar por la rampa: movemos el esquiador a lo largo de Z y aplicamos la inclinación de la rampa
      const progress = Math.min(tRun/runDuration, 1.0);
      const zOnRamp = startZOnRamp - progress * rampLength;
      const heightOnRamp = Math.sin(-ramp.rotation.x) * (startZOnRamp - zOnRamp) + startHeight;
      skier.position.set(0, heightOnRamp, zOnRamp);

      // postura más agachada
      skier.rotation.x = -0.6;

      if(progress >= 1.0){
        // Salto: pasar a vuelo
        state = "flying";
        tFly = 0;
        // velocidad inicial en el eje Z (hacia delante) y Y (vertical)
        velZ = -25;  // hacia el fondo
        velY = 8;    // impulso hacia arriba
      }
    }
    else if(state === "flying"){
      tFly += delta;

      // Control de inclinación con flechas ↑↓
      if(keys["ArrowUp"])  pitch -= 0.8 * delta;
      if(keys["ArrowDown"]) pitch += 0.8 * delta;
      pitch = Math.max(-0.7, Math.min(0.7, pitch));
      skier.rotation.x = pitch; // inclinamos el cuerpo

      // Simplificación: si el pitch está “bien” (ligeramente hacia adelante) reducimos la caída
      let effectiveGravity = gravity;
      if(pitch < 0){ // inclinado hacia adelante
        effectiveGravity = gravity * (0.5 + Math.abs(pitch)); // cae un poco más lento
      }

      velY += effectiveGravity * delta * 0.18; // factor para escalar a la escena
      skier.position.y += velY * delta;
      skier.position.z += velZ * delta;

      // Aterrizaje cuando toca el suelo virtual (y = -10 es el plano)
      if(skier.position.y <= -9.9){
        skier.position.y = -9.9;
        state = "landed";
      }
    }
    else if(state === "landed"){
      // Mantener postura fija al aterrizar
      skier.rotation.x = 0;
      // Podríamos mostrar aquí un mensaje con distancia etc.
    }

    // Colocar cámara detrás del esquiador mirando hacia adelante
    const camOffset = new THREE.Vector3(0, 2, 6); // por detrás y un poco arriba
    const worldPos = skier.position.clone();
    camera.position.set(
      worldPos.x + camOffset.x,
      worldPos.y + camOffset.y,
      worldPos.z + camOffset.z
    );
    camera.lookAt(worldPos.x, worldPos.y + 0.5, worldPos.z - 5);
  }

  let lastTime = performance.now();
  function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const delta = (now - lastTime)/1000;
    lastTime = now;

    updateSkier(delta);
    renderer.render(scene, camera);
  }
  animate();

  // Ajustar al redimensionar
  window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth*0.9, window.innerHeight*0.7);
  });
</script>
</body>
</html>
