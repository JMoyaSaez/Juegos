<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bingo – Cartón</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app">

    <header class="top">
      <div class="meta">
        <span id="createdAtLabel">Cartón: --:--:-- · Bombo: --:--:--</span>
      </div>
      <div id="status" class="statusText">—</div>
    </header>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="Cartón de bingo"></div>
    </section>

    <footer class="footer">
      <button id="newBtn">Nuevo cartón</button>
      <button id="clearBtn">Limpiar marcas</button>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
