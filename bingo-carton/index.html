<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cartón Bingo 3×9</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" role="application" aria-label="Cartón de bingo 3 por 9">
    <header class="topbar">
      <div class="title">
        <h1>Cartón Bingo</h1>
        <p>3×9 · 15 números · columnas por decenas · orden ↓ mayor→menor</p>
      </div>

      <div class="actions">
        <button id="themeBtn" class="icon" aria-label="Cambiar tema">🌙</button>
        <button id="newBtn" class="primary">Nuevo</button>
        <button id="clearBtn">Limpiar</button>
      </div>
    </header>

    <section class="status" aria-live="polite">
      <div class="chip ok" id="lineChip">Línea: no</div>
      <div class="chip ok" id="bingoChip">Bingo: no</div>
      <div class="chip" id="countChip">Marcados: 0/15</div>
    </section>
    
    <div id="createdAtLabel" class="meta"></div>
    <div id="status" class="status">—</div>
    <div class="board"></div>

    <section class="board-wrap">
      <div class="board" id="board" aria-label="Rejilla del cartón"></div>
    </section>

    <footer class="hint">
      Toca un número para marcar. Los huecos llevan el logo.
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
