<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0f14">
  <title>Bingo — Cartón</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" role="application" aria-label="Cartón de bingo 3 por 9">
    <header class="topbar">
      <button id="themeBtn" class="icon" aria-label="Cambiar tema">🌙</button>
      <div id="status" class="statusText">—</div>
      <div id="cartonTime" class="cartonTime"></div>
    </header>


    <section class="board-wrap">
      <div class="board" id="board" aria-label="Rejilla del cartón"></div>
    </section>

    <footer class="footer">
      <button id="newBtn" class="primary">Nuevo</button>
      <button id="clearBtn">Limpiar</button>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
